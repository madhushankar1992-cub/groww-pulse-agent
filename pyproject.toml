[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "groww-review-pulse"
version = "0.1.0"
description = "Groww weekly review pulse agent (Google Play); publishes via a separate Pulse MCP Server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "ijson>=3.3,<4",
  "tzdata>=2025.2",
  "spacy>=3.8.7,<3.9",
  "emoji>=2,<3",
  "lingua-language-detector>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
fetch = ["google-play-scraper>=1.2,<2"]
llm = ["groq>=0.31,<1", "jsonschema>=4.26,<5"]
groq = ["groq>=0.31,<1", "jsonschema>=4.26,<5"]
workflow = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "mcp>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[project.scripts]
pulse = "groww_pulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/groww_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = ["ner: uses the installed local spaCy English model"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
